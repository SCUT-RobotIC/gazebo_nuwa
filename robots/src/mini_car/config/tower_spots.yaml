# 建塔处坐标 + 检测点 + 作业点 —— 【自动生成，别手改】
# 生成：python3 field/gen_spots.py      数据源：field/field_config.py
#
# ── map 坐标系 ──────────────────────────────────────────
#   原点 = 己方启动区在场地角上的那个角（红 (5.5,−5.5) / 蓝 (5.5,+5.5)）
#   轴向 = +X 东 / +Y 北（纯平移，右手系 ✓）
#   红蓝关系 = 平移不是变号：两队原点差 (0,11)
#
# ── 两种点，作用不同 ────────────────────────────────────
#   vantage 检测点（每层 1 个）：第一次检测，一帧判完同层 4 个建塔处
#   spots[].work 作业点（每个 1 个）：第二次检测 + 准备放置，车头正对建塔处
#
#   ⚠ 检测两次：从检测点开到作业点这段路上，对手可能刚好放了一块。
#     第一次选目标，第二次确认目标。
#
#   ⚠ 作业点的朝向在世界系里是 ±45°，但【不影响机械臂】——
#     臂只认车坐标系，而建塔处永远在车坐标系的 (1.06, 0)（正前方）✓
#     8 个位置臂做的是同一个动作，只是高度分 L1/L2 两档。
#
# ── 层高与高度带（规则 + field/worlds 一致）────────────
#   地面 0 / L1 台面 0.600 / L2 台面 0.900（比 L1 高 0.300）
#   塔基 = 台面 + 0.00 ~ 0.35      中段 = 台面 + 0.35 ~ 0.70
#   每个建塔处最多两块（塔基 + 中段）
#
#   两台 2D 雷达分工（都以【车所在层台面】为基准）：
#     low   台面上方 0.175  → 切塔基正中间
#     high  台面上方 0.560  → 切中段；车在 L1 时还兼顾 L2 塔基
#     ★ 车在 L1 的世界高度 1.16 同时落在 L1 中段 [0.95,1.30] 和
#       L2 塔基 [0.90,1.25] 里 → 一条光束能看两层的不同段 ✓
#
# ── 输出取值（/tower_check/status）──────────────────────
#   空     塔基、中段都没有                → 可以放【塔基】
#   塔基   只有塔基，没有中段              → 可以放【中段】
#   满     塔基+中段都有                   → 换一个建塔处
#   未知   视线被挡/看不全                 → 挪个位置再看，绝不能当"空"！
#   —      不同层（或建塔处比车低）        → 跳过
#   ⚠ 车在 L1、建塔处在 L2 时只能看到 L2 的第一层：塔基=有/空=没有

frame: map

geometry:
  tower_spot: 0.500        # 建塔处边长 500 mm
  block: 0.350             # 塔基/中段边长 350 mm
  block_stack_height: 0.700  # 两块叠起来的高度 700 mm
  # 雷达安装位姿（base_link 系）。算法优先从 TF 读，这里只作文档；
  # xacro 的 <sensor><pose>、launch 的静态 TF 必须和这里一致 ✓
  radar_low:  {x: 0.420, y: 0.0, dz: -0.125}   # 台面上方 0.175
  radar_high: {x: 0.000, y: 0.0, dz:  0.260}   # 台面上方 0.560
  robot_radius: 0.48        # 车的包围圆半径（作业点都是按它算的）
  work_distance: 1.061      # 作业点到建塔处中心的距离（8 处统一）

